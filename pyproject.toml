[project]
name = "agent-fail-eval"
version = "0.1.0"
description = "Coding-agent failure evaluation: parse, replay, and report on long-session degradation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fail_eval"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ipython>=8.0.0"]

[project.scripts]
afe = "agent_fail_eval.cli:main"
